# Isolated staging TLS terminator. Never publish this listener without approved firewall rules.
server {
    listen 8443 ssl;
    server_name localhost;
    ssl_certificate /etc/nginx/tls/staging.crt;
    ssl_certificate_key /etc/nginx/tls/staging.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_tickets off;
    add_header Strict-Transport-Security "max-age=300" always;
    add_header X-Content-Type-Options nosniff always;
    location / {
        proxy_pass http://127.0.0.1:3097;
        proxy_http_version 1.1;
        proxy_set_header Host localhost:8443;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host localhost:8443;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Connection "";
        proxy_read_timeout 30s;
        client_max_body_size 15m;
    }
}
