name: Gate 1 identity diagnostic tests
on:
  pull_request:
    paths:
      - 'cmms/src/identity-integrity.js'
      - 'cmms/tests/identity-integrity.test.js'
      - 'cmms/tools/identity-integrity.mjs'
      - '.github/workflows/gate1-identity-diagnostics.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-identity-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test cmms/tests/identity-integrity.test.js
