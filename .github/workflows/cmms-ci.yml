name: CMMS checks
on:
  push:
    paths: ['cmms/**']
  pull_request:
    paths: ['cmms/**']
jobs:
  checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cmms
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: cmms/package-lock.json
      - run: npm ci
      - run: npm run check